#  ============================================================
#   AnarchyCore — конфигурация анархия-сервера (Paper 1.16.5)
#  ============================================================

general:
  # Показывать игрокам информацию о задержке регена при входе
  announce-spawn-pvp: true
  # Отладочные сообщения в консоль
  debug: false

# ------------------------------------------------------------
#  PvE в стиле 1.8 — долгие битвы, медленная регенерация
# ------------------------------------------------------------
pve:
  enabled: true
  # Базовое здоровье игрока (20 = 10 сердец, как в ваниле)
  player-base-health: 20.0
  # Секунд без регена после получения урона (главный фактор "долгих боёв")
  regen-delay-seconds: 60
  # Сила зелья регенерации (0 = Реген I). Выше — быстрее хил из зелий
  potion-regen-amplifier: 0.0
  # Запретить эффект Поглощения (золотые яблоки только хил+абсорб на 1.8-уровне)
  disable-absorption: true
  # Кристалл-пвп: разрешить ставить End Crystal на obsidian/bedrock руками
  crystal-pvp: true
  # Взрывы кристаллов ломают блоки (по умолчанию ванильные взрывы и так всё ломают вне спавна)
  end-crystal-breaks-blocks: false
  # Разрешить старые механики TNT-дюпа (on | off)
  tnt-duplication: true
  # Keep inventory при смерти (на анархии обычно false!)
  keep-inventory: false

# ------------------------------------------------------------
#  Буры — кастомные скоростные кирки с топливом
#  /drill give [игрок] <1|2|3>  (нужен anarchy.admin)
#  Shift+ПКМ по воздуху — смена режима; ведро лавы — заправка
# ------------------------------------------------------------
drills:
  enabled: true
  # Максимум единиц топлива (1 блок ≈ fuel-per-block единиц)
  fuel-max: 4096
  fuel-per-block: 1.0
  # Прочность бура в сломанных блоках
  durability-max: 8000
  # Починка алмазом/незеритом во второй руке (ПКМ)
  repair-with-diamond: true
  # Бур не плавится в лаве
  lava-safe: true

# ------------------------------------------------------------
#  Многостраничные сундуки
#  Любой поставленный сундук становится сундуком на N страниц.
#  GUI: 27 слотов контента + панель навигации внизу.
#  При поломке сундука все предметы выпадают наружу.
# ------------------------------------------------------------
big-chests:
  enabled: true
  # Количество страниц (1 страница = 27 слотов). 6 страниц = 162 слота
  pages: 6
  # Требовать кирку для добычи сундука (иначе предметы потеряются? нет, но анти-гриф)
  require-pickaxe-to-mine: true
  # Показывать владельца в /chestinfo
  show-owner-in-lore: true

# ------------------------------------------------------------
#  Анархия / спавн
# ------------------------------------------------------------
anarchy:
  # Защищённый купол вокруг спавна (единственное место без грифа)
  spawn-protection: true
  # Радиус защиты в блоках (0 = вся карта анархична)
  spawn-radius: 512
  # В аду и Энде защита никогда не действует (полная анархия)
  nether-no-limits: true
  # Вне спавна можно всё: ломать, ставить, взрывать
  allow-grief-outside-spawn: true

# ------------------------------------------------------------
#  Производительность под нагрузки анархии (TNT-войны)
# ------------------------------------------------------------
performance:
  world-border: true
  # Размер мира-границы (квадрат, блоков). 50 млн ~ вся карта
  world-border-size: 50000000.0
  auto-unload-chunks: true
  # Лимит активных TNT-сущностей на мир (защита от крашей)
  max-tnt-entities: 600
